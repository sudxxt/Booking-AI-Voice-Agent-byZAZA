[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[default]

[from-internal]
; Route all numbers to Stasis
exten => _X.,1,NoOp(Routing call to AI Voice Agent)
 same => n,Answer()
 same => n,Set(AI_CONTEXT=default)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; Specific test extension
exten => 100,1,NoOp(AI Voice Agent Test)
 same => n,Answer()
 same => n,Set(AI_CONTEXT=default)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()
