[global]
type=global
max_initial_qualify_time=0
keep_alive_interval=90
contact_expiration_check_interval=30
default_outbound_endpoint=default_outbound

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; Default outbound endpoint (required by global config)
[default_outbound]
type=endpoint
context=default
disallow=all
allow=ulaw
allow=alaw

; ─── Test SIP Account (for softphone testing) ───
; Register a softphone (e.g., MicroSIP, Zoiper, Linphone) with:
;   Server: <your_host_ip>:5060
;   Username: 6001
;   Password: test1234
;   Transport: UDP

[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=auth6001
aors=6001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth6001]
type=auth
auth_type=userpass
password=test1234
username=6001

[6001]
type=aor
max_contacts=5
qualify_frequency=60
